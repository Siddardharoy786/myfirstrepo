<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Web Page</title>
</head>
<body>

    <!-- Main Heading -->
    <h1>Welcome to My Website</h1>

    <!-- Paragraph of text -->
    <p>This is a sample paragraph. HTML is easy to learn and helps you build structure for the web.</p>

    <!-- Subheading -->
    <h2>Useful Links and Features</h2>

    <!-- Hyperlink to an external site -->
    <p>Visit the official documentation on <a href="https://developer.mozilla.org" target="_blank">MDN Web Docs</a>.</p>

    <!-- Bulleted List -->
    <ul>
        <li>HTML structures content</li>
        <li>CSS adds beautiful styles</li>
        <li>JavaScript adds interactivity</li>
    </ul>

    <!-- Image Example (Replace placeholder with your actual image path) -->
    <img src="https://placeholder.com" alt="Sample Placeholder Image" width="150">

</body>
</html>
